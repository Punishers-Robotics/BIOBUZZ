name: Portfolio PDF

on:
  push:
    paths:
      - 'doc/team/portfolio/**'
      - '.github/workflows/portfolio.yml'
  pull_request:
    paths:
      - 'doc/team/portfolio/**'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Typst
        uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4
        with:
          typst-version: '0.15.1'
      - name: Compile preview PDF
        shell: pwsh
        run: ./doc/team/portfolio/build.ps1
      - name: Upload preview PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-${{ github.sha }}
          path: doc/team/portfolio/build/portfolio.pdf
          if-no-files-found: error
          retention-days: 30
